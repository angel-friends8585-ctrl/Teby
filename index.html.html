<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ظرف طارئ — مؤسسة أصدقاء الملائكة</title>
<meta name="theme-color" content="#5BC2FA">
<meta name="description" content="خدمة استعارة الأجهزة الطبية — مؤسسة أصدقاء الملائكة">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">

<style>
:root{--g:#5FD13F;--gd:#2E9A17;--o:#EC5428;--b:#5BC2FA;--bd:#1C8FD0;--ink:#1F3446;--mu:#5D7385;--bg:#F4FAFF;--ln:#E1EEF7}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:Cairo,Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;padding-bottom:84px}
#top{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;background:#fff;position:sticky;top:0;z-index:5;border-bottom:4px solid;border-image:linear-gradient(90deg,var(--g) 33%,var(--b) 33% 66%,var(--o) 66%) 1;flex-wrap:wrap}
#top img{width:44px;height:44px;border-radius:50%}#top b{font-size:1.05rem;line-height:1.2;display:block}#top small{color:var(--mu);font-size:.72rem}
#top .hi{color:var(--gd);font-weight:700;font-size:.8rem}
main{max-width:820px;margin:0 auto;padding:14px;animation:fi .25s}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
h2{font-size:1.1rem;margin:16px 0 8px;font-weight:800}
.c{background:#fff;border:1px solid var(--ln);border-radius:18px;padding:12px;margin-bottom:10px;box-shadow:0 6px 16px -14px rgba(31,52,70,.6)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:10px}
.k{border-radius:18px;padding:12px;color:#fff;font-weight:700;font-size:.9rem}.k b{display:block;font-size:1.6rem;line-height:1.2}
button,.b{font:inherit;font-weight:700;border:0;border-radius:12px;padding:8px 14px;cursor:pointer;background:var(--bd);color:#fff;text-decoration:none;display:inline-block;transition:transform .1s,filter .15s}
button:hover,.b:hover{filter:brightness(1.08)}button:active,.b:active{transform:scale(.97)}
.g{background:var(--gd)}.o{background:var(--o)}.r{background:#C62828}.w{background:#25D366}.l{background:#EAF3F9;color:var(--ink)}
input,select,textarea{font:inherit;width:100%;padding:9px 12px;border:2px solid var(--ln);border-radius:12px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--b)}textarea{min-height:70px;resize:vertical}
input[type=checkbox]{width:auto}
label{display:block;font-weight:600;font-size:.85rem;color:var(--mu);margin:8px 0 2px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1;min-width:0}.ctr{text-align:center}
.t{font-style:normal;font-size:.75rem;font-weight:700;padding:2px 10px;border-radius:99px;color:#fff;background:var(--mu);white-space:nowrap}
.t.ok{background:var(--gd)}.t.out{background:var(--bd)}.t.mt{background:var(--o)}.t.bad{background:#C62828}
.dv{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;cursor:pointer;padding:10px;margin:0;transition:transform .15s,box-shadow .15s}
.dv:hover{transform:translateY(-3px);box-shadow:0 12px 22px -14px rgba(31,52,70,.7)}
.pic{width:84px;height:84px;border-radius:20px;background:linear-gradient(135deg,#EAF7E4,#E3F4FE);display:grid;place-items:center;font-size:2.6rem;overflow:hidden}.pic img{width:100%;height:100%;object-fit:cover}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0}.chips button{white-space:nowrap}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0);z-index:5}
nav button{flex:1;background:none;color:var(--mu);border-radius:0;font-size:.64rem;padding:6px 1px;line-height:1.3;position:relative}nav i{display:block;font-style:normal;font-size:1.25rem}nav .on{color:var(--o);box-shadow:inset 0 3px var(--o)}
nav em{position:absolute;top:2px;left:50%;background:var(--o);color:#fff;font-style:normal;font-size:.65rem;border-radius:99px;padding:0 6px}
dialog{border:0;border-radius:22px;padding:16px;width:min(94vw,540px);max-height:90vh;margin:auto;color:var(--ink)}dialog::backdrop{background:rgba(31,52,70,.55)}
table{width:100%;border-collapse:collapse;font-size:.85rem;margin-top:8px}td,th{padding:6px;border-bottom:1px solid var(--ln);text-align:right;vertical-align:top}th{color:var(--mu);white-space:nowrap}
.docs img{width:72px;height:72px;object-fit:cover;border-radius:10px}.dt{position:relative}.dt button{position:absolute;top:-4px;left:-4px;padding:0 7px;border-radius:99px}
summary{cursor:pointer}
#toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 18px;border-radius:99px;opacity:0;transition:.2s;pointer-events:none;z-index:30;font-weight:600;max-width:90vw;text-align:center}#toast.on{opacity:1}
/* hero & gate */
.hero{position:relative;overflow:hidden;border-radius:26px;padding:22px 18px;color:#fff;text-align:center;background:linear-gradient(135deg,#1C8FD0,#5BC2FA 55%,#5FD13F);margin-bottom:14px}
.hero h1{font-size:1.7rem;font-weight:800;line-height:1.3}.hero p{opacity:.95}
.hero .fl{position:absolute;font-size:2rem;opacity:.35;animation:fl 4s ease-in-out infinite}
.hero .lg{width:96px;height:96px;border-radius:50%;border:4px solid #fff;background:#fff;margin-bottom:6px}
.hero svg{display:block;margin:8px auto 0;width:100%;max-width:340px;height:34px}
.gate{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.gc{text-align:center;padding:18px 14px}.gc .gi{font-size:2.6rem}.gc b{display:block;font-size:1.1rem;margin:4px 0}.gc small{display:block;color:var(--mu);margin-bottom:10px}.gc button{width:100%}
.svc{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;cursor:pointer;padding:14px 8px;position:relative;margin:0;transition:transform .15s}
.svc:hover{transform:translateY(-3px)}.svc .si{font-size:2.3rem}.svc b{font-size:.95rem}.svc .t{position:absolute;top:8px;left:8px}
.bar{height:10px;background:var(--ln);border-radius:99px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--g),var(--b))}
.wel{background:linear-gradient(135deg,#EAF7E4,#E3F4FE);border:0}.wel h2{margin:0 0 2px;font-size:1.25rem}
.svd{color:var(--gd);font-weight:700}
.soc{display:flex;gap:8px;margin-top:10px}.soc button{flex:1;background:#fff;color:var(--ink);border:2px solid var(--ln)}
.sep{display:flex;align-items:center;gap:8px;color:var(--mu);font-size:.8rem;margin:12px 0}.sep:before,.sep:after{content:"";flex:1;height:1px;background:var(--ln)}
/* chat */
#fab{position:fixed;bottom:92px;left:14px;width:58px;height:58px;border-radius:50%;font-size:1.7rem;padding:0;background:var(--o);box-shadow:0 10px 22px -8px rgba(236,84,40,.8);z-index:6}
#chat{position:fixed;bottom:0;left:0;right:0;margin:auto;max-width:440px;height:72vh;background:#fff;border-radius:22px 22px 0 0;box-shadow:0 -10px 40px rgba(31,52,70,.35);z-index:25;display:flex;flex-direction:column}
#chat[hidden]{display:none}
#ch{display:flex;align-items:center;gap:8px;padding:10px 14px;background:linear-gradient(135deg,var(--bd),var(--b));color:#fff;border-radius:22px 22px 0 0;font-weight:800}
#cb{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.mg{max-width:85%;padding:8px 12px;border-radius:16px;font-size:.9rem;white-space:pre-line}.mg.bot{background:#fff;border:1px solid var(--ln);align-self:flex-start}.mg.me{background:var(--bd);color:#fff;align-self:flex-end}
#cq{display:flex;gap:6px;overflow-x:auto;padding:6px 8px;border-top:1px solid var(--ln)}#cq button{white-space:nowrap;font-size:.78rem;padding:5px 10px}
#cf{display:flex;gap:6px;padding:8px;border-top:1px solid var(--ln);padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
/* print */
#pr{display:none}
.pd{font-family:Cairo,Tahoma,Arial,sans-serif;color:#000;font-size:13px;line-height:1.7}
.pd .ph{display:flex;align-items:center;gap:12px;border-bottom:3px solid #1C8FD0;padding-bottom:8px;margin-bottom:8px}.pd .ph img{width:70px;height:70px;border-radius:50%}
.pd h1{font-size:18px}.pd h2{font-size:14px;margin:0;color:#444}.pd h3{font-size:14px;margin:12px 0 2px;background:#EAF3F9;padding:2px 8px;border-radius:6px}
.pd .pn{margin-right:auto;font-size:12px;text-align:left}.pd table th{width:26%;background:#fafafa}.pd table{border:1px solid #ccc}.pd td,.pd th{border:1px solid #ccc;padding:4px 8px}
.pd ol{padding-right:20px}.pd .sg{display:flex;gap:16px;margin-top:34px}.pd .sg div{flex:1;text-align:center;border-top:1px solid #000;padding-top:4px}
@media print{body>*:not(#pr){display:none!important}#pr{display:block!important}body{background:#fff;padding:0}@page{margin:12mm}}
</style>
</head>
<body>
<div id="top"></div><main id="app"></main><nav id="nav"></nav>
<button id="fab" data-a="chat" hidden aria-label="المساعد">💬</button>
<div id="chat" hidden><div id="ch"><span>🤖</span><span class="sp">المساعد الآلي — ظرف طارئ</span><button class="l" data-a="chat" style="padding:2px 10px">✕</button></div><div id="cb"></div><div id="cq"></div><form id="cf" data-f="chat"><input name="q" placeholder="اكتب سؤالك هنا..." autocomplete="off" class="sp"><button class="o">إرسال</button></form></div>
<dialog id="m"><div id="mb"></div></dialog><div id="toast"></div><div id="pr"></div>
<script>
const LOGO='data:image/jpeg;base64,__LOGO__';
/* ===== إعدادات الربط (اتركها فارغة حاليًا) =====
   GOOGLE: ضع هنا Google OAuth Client ID لتفعيل الدخول بجوجل
   FB:     ضع هنا Facebook App ID لتفعيل الدخول بفيسبوك */
const CFG={GOOGLE:'',FB:'',WA:'01228489636'};
const $=s=>document.querySelector(s),T=()=>new Date().toISOString().slice(0,10);
const add=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)},diff=(a,b)=>Math.round((new Date(a)-new Date(b))/864e5);
const dt=d=>d?new Date(d).toLocaleDateString('ar-EG'):'-',mny=n=>(+n||0).toLocaleString('ar-EG')+' ج';
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hs=s=>{let h=5381;for(const c of'zt#'+s)h=(h*33^c.charCodeAt(0))>>>0;return h.toString(36)};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const DEF_TERMS=['إحضار صورة بطاقة الرقم القومي وأي أوراق تطلبها المؤسسة (مثل تقرير طبي أو روشتة) عند الاستلام.','سداد مبلغ التأمين المحدد للجهاز عند الاستلام.','يُردّ التأمين كاملًا عند إعادة الجهاز سليمًا في الموعد، ويحق للمستعير التبرع به أو بجزء منه للمؤسسة.','يُخصم من التأمين في حال تلف الجهاز أو عدم إعادته في الموعد المحدد.','الجهاز للاستخدام الشخصي للمستفيد فقط ولا يجوز إعارته لشخص آخر.','يمكن طلب تجديد المدة قبل انتهائها بالتواصل مع المؤسسة.','عدم الالتزام بإعادة الجهاز قد يترتب عليه إيقاف الاستفادة من الخدمة مستقبلًا.'];
let DB;try{DB=JSON.parse(localStorage.getItem('zt2'))}catch(x){}DB=DB||{};
DB={admins:[],cats:[],dev:[],bor:[],loan:[],req:[],seq:{},...DB};DB.set=DB.set||{days:14,ren:7,terms:DEF_TERMS};
if(!DB.admins.some(a=>a.n==='angel'))DB.admins.push({n:'angel',h:hs('8585'),main:1});
let AD='',BN='';try{AD=sessionStorage.getItem('zta')||''}catch(x){}try{BN=localStorage.getItem('ztb')||''}catch(x){}
let S={v:'home',scr:'land',cat:'',sf:'',q:'',lt:'act',pre:null,fq:null,chat:[]},DIP=null,AS=0;
const STD=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
const save=()=>{try{localStorage.setItem('zt2',JSON.stringify(DB))}catch(x){toast('المساحة ممتلئة، قلّل حجم الصور')}};
const toast=m=>{const t=$('#toast');t.textContent=m;t.className='on';clearTimeout(toast.i);toast.i=setTimeout(()=>t.className='',2600)};
const M=h=>{$('#mb').innerHTML=h;const d=$('#m');d.open||d.showModal()},X=()=>{const d=$('#m');d.open&&d.close()};
const rz=(f,m,q)=>new Promise(r=>{const i=new Image,u=URL.createObjectURL(f);i.onload=()=>{const s=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);r(c.toDataURL('image/jpeg',q))};i.onerror=()=>r('');i.src=u});
const fld=(l,n,t='text',v='',x='')=>t==='textarea'?`<label>${l}</label><textarea name="${n}" ${x}>${e(v)}</textarea>`:`<label>${l}</label><input name="${n}" type="${t}" value="${e(v)}" ${x}>`;
const btns=(ok,c='')=>`<div class="row" style="margin-top:12px"><button class="${c}">${ok}</button><button type="button" class="l" data-a="x">إغلاق</button></div>`;
const phn=p=>String(p||'').replace(/\D/g,'').replace(/^0/,''),wa=(p,t)=>`https://wa.me/20${phn(p)}?text=${encodeURIComponent(t)}`;
const PR=h=>{X();$('#pr').innerHTML=h;setTimeout(()=>print(),200)};

/* ---------- الأقسام والأنواع ---------- */
const CONDS=['جديد','مستعمل','يحتاج صيانة','مُكهّن'],CLS={'متاح':'ok','معار':'out','صيانة':'mt','مُكهّن':''};
const TY={mv:[['مشاية','🚶'],['عكاز','🦯'],['كرسي متحرك بيت','🦽'],['كرسي متحرك خروج','♿'],['كرسي متحرك وزن ثقيل','🦽'],['كرسي متحرك أطفال','🧒'],['مشاية أطفال','👶'],['طرف صناعي','🦿']],
br:[['جنريتور أكسجين','⚡'],['أنبوبة تنفس ٤٠','🧪'],['أنبوبة تنفس ٢٠','🧪'],['أنبوبة تنفس ١٠','🧪'],['نيبولايزر','💨'],['أوكسيميتر','🩸']],
cr:[['سرير طبي','🛏️'],['جهاز شفط بلغم','🧴'],['مرتبة هوائية','🛌'],['استاند محلول','💧']],
sm:[['جهاز ضغط','🩺'],['جهاز سكر','🩸'],['فوطة ساخنة','🔥'],['جهاز مساج','💆']],ot:[]};
const cat=id=>DB.cats.find(c=>c.id===id)||{n:'-',ic:'📦'},dev=id=>DB.dev.find(d=>d.id===id)||{},bor=id=>DB.bor.find(b=>b.id===id)||{};
const ldv=l=>DB.dev.find(x=>x.id===l.dev)||{name:l.dn||'جهاز محذوف',code:l.dc||'',ic:'📦'};
const act=id=>DB.loan.find(l=>l.dev===id&&!l.ret);
const st=d=>d.cond==='مُكهّن'?'مُكهّن':d.cond==='يحتاج صيانة'?'صيانة':act(d.id)?'معار':'متاح';
const ico=(n,c)=>{for(const k in TY){const f=TY[k].find(x=>x[0]===n);if(f)return f[1]}return cat(c).ic};
const pic=d=>d.img?`<img src="${d.img}" alt="">`:(d.ic||'📦');
function mk(c,name,q,cond,img='',dep=0){const C=cat(c);for(let i=0;i<q;i++){const n=DB.seq[c]=(DB.seq[c]||0)+1;DB.dev.push({id:uid(),code:C.p+'-'+String(n).padStart(3,'0'),name,cat:c,ic:ico(name,c),img,cond,dep:+dep||0})}}
function mkBor(o){const n=DB.seq.b=(DB.seq.b||0)+1,b={id:uid(),code:'B-'+String(n).padStart(4,'0'),bl:'',docs:[],nid:'',ad:'',em:'',bd:'',job:'',fam:'',health:'',pw:'',prov:'',at:T(),...o};DB.bor.push(b);return b}
const nextNo=()=>'L-'+String(DB.seq.l=(DB.seq.l||0)+1).padStart(4,'0');
function cats(){if(!DB.cats.length)DB.cats=[{id:'mv',n:'حركية',ic:'🦽',p:'MV'},{id:'br',n:'تنفس',ic:'🫁',p:'BR'},{id:'cr',n:'رعاية',ic:'🛏️',p:'CR'},{id:'sm',n:'أجهزة صغيرة',ic:'🩺',p:'SM'},{id:'ot',n:'أجهزة منزلية أخرى',ic:'🏠',p:'OT'}]}
function demo(){cats();const DEP={mv:300,br:500,cr:300,sm:100,ot:200};let n=0;for(const c in TY)TY[c].forEach(([name],i)=>{mk(c,name,1+(i+n++)%3,i%7==5?'يحتاج صيانة':i%2?'مستعمل':'جديد','',DEP[c])});
 const a=mkBor({n:'أحمد محمود',ph:'01012345678',nid:'28801010101011',ad:'المطرية، القاهرة'}),b=mkBor({n:'سعاد إبراهيم',ph:'01123456789',nid:'27505050505052',ad:'عين شمس، القاهرة'}),c3=mkBor({n:'محمد علي',ph:'01234567890',nid:'29003030303033',ad:'المرج، القاهرة',bl:'لم يُعد الجهاز في الموعد'});
 const pk=nm=>{const d=DB.dev.find(x=>x.name===nm&&!act(x.id));d.cond='مستعمل';return d.id};
 const L=(d,bo,s,days,dep,why,ret)=>DB.loan.push({id:uid(),no:nextNo(),dev:pk(d),bor:bo.id,start:add(T(),-s),days,due:add(T(),days-s),dep,why,by:'angel',ren:0,g:'',gp:'',gn:'',acc:'',ret:ret||null});
 L('كرسي متحرك بيت',a,20,14,500,'كسر بالقدم');L('نيبولايزر',b,12,14,200,'أزمة تنفسية');L('جهاز ضغط',a,40,14,150,'متابعة ضغط',{d:add(T(),-25),c:'مستعمل',o:'part',rf:100,dn:50,dd:0,w:''});
 DB.req.push({id:uid(),bor:b.id,type:'سرير طبي',when:add(T(),3),why:'رعاية منزلية',days:14,st:'جديد',rp:'',at:T()})}
const pct=b=>{const f=[b.n,b.ph,b.em,b.nid,b.bd,b.ad,b.job,b.fam,b.health,(b.docs||[]).length];return Math.round(f.filter(Boolean).length/f.length*100)};
const PROF=['n','ph','em','nid','bd','ad','job','fam','health'];
const profFields=b=>fld('الاسم الكامل','n','text',b.n,'required')+fld('رقم الموبايل','ph','tel',b.ph,'required')+fld('البريد الإلكتروني','em','email',b.em)+fld('الرقم القومي','nid','text',b.nid,'inputmode="numeric" maxlength="14"')+fld('تاريخ الميلاد','bd','date',b.bd)+fld('العنوان بالتفصيل','ad','text',b.ad)+fld('المهنة','job','text',b.job)+fld('عدد أفراد الأسرة','fam','number',b.fam,'min="0"')+fld('الحالة الصحية / سبب الحاجة للخدمة','health','textarea',b.health);
const PROV={email:'بريد إلكتروني',google:'Google',facebook:'Facebook','':'أدخله المشرف'};
const profRows=b=>[['الكود',b.code],['الاسم',b.n],['الموبايل',b.ph],['البريد الإلكتروني',b.em],['الرقم القومي',b.nid],['تاريخ الميلاد',b.bd?dt(b.bd):''],['العنوان',b.ad],['المهنة',b.job],['عدد أفراد الأسرة',b.fam],['الحالة الصحية / سبب الحاجة',b.health],['طريقة التسجيل',PROV[b.prov]||''],['تاريخ التسجيل',dt(b.at)]];

/* ---------- الطباعة ---------- */
const pHead=t=>`<div class="ph"><img src="${LOGO}" alt=""><div><h1>مؤسسة أصدقاء الملائكة</h1><h2>خدمة ظرف طارئ — ${t}</h2></div>`;

<div class="sg"><div>توقيع المستعير</div><div>توقيع الضامن</div><div>الموظف المسؤول: ${e(l.by||'')}</div></div></div>`}

const avail=()=>{const g={};DB.dev.filter(d=>d.cond!=='مُكهّن').forEach(d=>{const x=g[d.name]=g[d.name]||{n:d.name,ic:d.ic,img:d.img,dep:d.dep||0,t:0,a:0};x.t++;if(st(d)==='متاح')x.a++;if(!x.img&&d.img)x.img=d.img;if(!x.dep&&d.dep)x.dep=d.dep});return Object.values(g)};
const termsBox=()=>`<div class="c"><b>📜 شروط الاستعارة</b><p style="margin:4px 0">المدة المسموح بها: <b>${DB.set.days} يومًا</b> قابلة للتجديد (${DB.set.ren} أيام).</p><button class="l" data-a="terms">عرض الشروط كاملة</button></div>`;
const BV={
home(){const b=bor(BN),p=pct(b),my=DB.req.filter(r=>r.bor===BN).slice(-1)[0],lo=DB.loan.filter(l=>l.bor===BN&&!l.ret);
 return `<div class="c wel"><h2>أهلاً، ${e(b.n)} 👋</h2><small>يسعدنا خدمتك. اختر ما تحتاجه من الخدمات أدناه.</small>${p<100?`<div class="bar"><i style="width:${p}%"></i></div><div class="row"><small class="sp">اكتمال بياناتك ${p}%</small><button class="g" data-a="go" data-id="prof">أكمل بياناتك</button></div>`:''}</div>
<h2>خدماتنا</h2>${svcGrid()}

${lo.length?`<h2>أجهزة بحوزتي</h2>${lo.map(l=>`<div class="c"><div class="row"><b class="sp">${e(ldv(l).name)}</b><i class="t ${l.due<T()?'bad':'out'}">${l.due<T()?'متأخر':'جارٍ'}</i></div><small>موعد الإعادة: ${dt(l.due)}</small></div>`).join('')}`:''}
${my?`<h2>آخر طلب لي</h2><div class="c"><div class="row"><b class="sp">${e(my.type)}</b><i class="t ${reqTag(my.st)}">${e(my.st)}</i></div>${my.rp?`<small>رد المؤسسة: ${e(my.rp)}</small>`:''}</div>`:''}`},
dev(){const q=S.q.toLowerCase(),L=avail().filter(x=>!q||x.n.toLowerCase().includes(q));
 return `${termsBox()}<div class="row">${srch('ابحث عن جهاز')}</div><h2>الأجهزة المتاحة والتأمين</h2><div class="grid">${L.map(x=>`<div class="c dv" style="cursor:default"><div class="pic">${x.img?`<img src="${x.img}" alt="">`:x.ic}</div><b>${e(x.n)}</b><i class="t ${x.a?'ok':'bad'}">${x.a?`متاح ${x.a} من ${x.t}`:'غير متاح حاليًا'}</i><small>التأمين: ${x.dep?mny(x.dep):'يُحدد عند الاستلام'}</small><button class="${x.a?'o':'l'}" data-a="askdev" data-id="${e(x.n)}" style="margin-top:6px">${x.a?'اطلبه':'سجّل طلبًا'}</button></div>`).join('')||'<p class="ctr" style="grid-column:1/-1">لا توجد أجهزة مسجلة حاليًا</p>'}</div>`},
req(){const b=bor(BN),p=S.pre||{},types=[...new Set(avail().map(x=>x.n))];

 if(!b.n||!b.ph||!b.nid)return `<div class="c ctr">📝 يلزم استكمال بياناتك (الاسم، الموبايل، الرقم القومي) قبل تقديم الطلب.<br><button class="g" data-a="go" data-id="prof" style="margin-top:8px">استكمال البيانات</button></div>`;
 return `<h2>طلب استعارة جهاز</h2>${termsBox()}<form class="c" data-f="breq"><label>الجهاز المطلوب</label><select name="t">${types.map(t=>`<option ${t===p.type?'selected':''}>${e(t)}</option>`).join('')}<option value="أخرى">أخرى (اذكرها في السبب)</option></select>${fld('موعد الاستلام المطلوب','w','date',p.when||add(T(),1),`min="${T()}"`)}${fld('مدة الاستعارة (أيام) — الحد '+DB.set.days,'d','number',DB.set.days,`min="1" max="${DB.set.days}"`)}${fld('سبب الاستعارة','y','text','','required')}<label style="display:flex;gap:8px;align-items:center;margin-top:12px"><input type="checkbox" name="ag" required> أوافق على شروط الاستعارة</label><button class="g" style="width:100%;margin-top:12px">إرسال وحفظ الطلب</button></form>`},
my(){const L=DB.req.filter(r=>r.bor===BN).reverse();return `<h2>طلباتي (${L.length})</h2>`+(L.map(r=>`<div class="c"><div class="row"><b class="sp">${e(r.type)}</b><i class="t ${reqTag(r.st)}">${e(r.st)}</i></div><small>الاستلام المطلوب ${dt(r.when)} · ${r.days} يوم · قُدّم ${dt(r.at)}</small><div>${e(r.why)}</div>${r.rp?`<div class="c" style="margin:6px 0 0;background:#F4FAFF">💬 رد المؤسسة: ${e(r.rp)}</div>`:'<small>بانتظار رد المؤسسة…</small>'}${r.st==='جديد'?`<div style="margin-top:6px"><button class="r" data-a="rqcancel" data-id="${r.id}">إلغاء الطلب</button></div>`:''}</div>`).join('')||'<p class="ctr">لم تقدّم أي طلب بعد</p>')},
prof(){const b=bor(BN),p=pct(b);return `<div class="c"><div class="row"><b class="sp">بياناتي الشخصية</b><small id="sv" class="svd">يتم الحفظ تلقائيًا ✓</small></div><div class="bar"><i style="width:${p}%"></i></div><small>اكتمال البيانات ${p}%</small><form data-f="prof" data-auto data-id="${b.id}">${profFields(b)}<button class="g" style="margin-top:12px;width:100%">حفظ البيانات</button></form></div><div class="c"><b>صور الأوراق (البطاقة وغيرها)</b><div class="docs row" style="margin:8px 0">${(b.docs||[]).map((s,i)=>`<div class="dt"><img src="${s}" alt=""><button class="r" data-a="deldoc" data-id="${i}">×</button></div>`).join('')||'<small>لم تُرفع أوراق بعد</small>'}</div><input type="file" id="pdocs" accept="image/*" multiple></div>`}};

[['شروط','شرط','ورق','اوراق','مستندات','بطاق','ضمان'],()=>'شروط الاستعارة:\n'+DB.set.terms.map((t,i)=>(i+1)+'. '+t).join('\n')],

[['شكرا','تسلم','جزاك','متشكر'],()=>'العفو 🌷 نحن في خدمتك دائمًا.'],

bm:d=>{const b=bor(d.id),h=DB.loan.filter(l=>l.bor===d.id);M(`<h2>${e(b.n)} ${b.bl?'<i class="t bad">مرفوض</i>':''}</h2>${kv(profRows(b))}${b.bl?`<p class="c" style="border-color:#C62828;margin-top:8px">سبب الرفض: ${e(b.bl)}</p>`:''}<h2>الأوراق المرفقة</h2><div class="docs row">${(b.docs||[]).map(s=>`<img src="${s}" alt="">`).join('')||'<small>لا توجد أوراق</small>'}</div><h2>سجل الاستعارة (${h.length})</h2>${h.map(l=>`<div class="c">${e(ldv(l).name)} · ${dt(l.start)} ← ${l.ret?dt(l.ret.d):'جارية'} · ${mny(l.dep)}</div>`).join('')||'<p>لا توجد استعارات</p>'}<div class="row"><button class="g" data-a="bmloan" data-id="${b.id}">استعارة جديدة</button><button data-a="bedit" data-id="${b.id}">تعديل</button><button class="l" data-a="prb" data-id="${b.id}">🖨️ طباعة</button>${b.bl?`<button class="l" data-a="unbl" data-id="${b.id}">رفع الرفض</button>`:`<button class="r" data-a="bl" data-id="${b.id}">قائمة سوداء</button>`}<button class="l" data-a="x">إغلاق</button></div>`)},
prl:d=>PR(loanDoc(DB.loan.find(x=>x.id===d.id))),prb:d=>PR(profDoc(bor(d.id))),
bl:d=>M(`<h2>إضافة للقائمة السوداء</h2><form data-f="bl" data-id="${d.id}">${fld('سبب الرفض','w','text','','required')}${btns('تأكيد المنع','r')}</form>`),
unbl:d=>{bor(d.id).bl='';save();X();render();toast('تم رفع الرفض')},
bmloan:d=>{S.pre={bor:d.id};A.newloan()},
newloan:()=>{const p=S.pre||{},pb=bor(p.bor);S.pre=null;let f=0;const av=DB.dev.filter(d=>st(d)==='متاح').sort((a,b)=>a.name>b.name?1:-1),first=av.find(d=>d.name===p.type)||av[0]||{};
 M(`<h2>استعارة جديدة</h2><form data-f="loan"><label>المستعير (الاسم أو الكود)</label><input name="b" list="bl" required value="${pb.code?e(pb.code+' · '+pb.n):''}"><datalist id="bl">${DB.bor.map(b=>`<option value="${e(b.code+' · '+b.n)}">`).join('')}</datalist><label>الجهاز المتاح</label><select name="d" required>${av.map(d=>{const s=first.id===d.id;return `<option value="${d.id}" ${s?'selected':''}>${e(d.name)} — ${d.code}</option>`}).join('')}</select><div class="row"><div class="sp">${fld('المدة (أيام)','n','number',p.days||DB.set.days,'min="1"')}</div><div class="sp">${fld('التأمين المدفوع (ج)','p','number',first.dep||0,'min="0"')}</div></div>${fld('سبب الاستعارة','w')}${fld('ملحقات الجهاز / ملاحظات','acc')}<b style="display:block;margin-top:10px">بيانات الضامن (اختياري)</b>${fld('اسم الضامن','g')}${fld('موبايل الضامن','gp','tel')}${fld('الرقم القومي للضامن','gn')}${btns('تسجيل الاستعارة','g')}</form>`)},
ren:d=>M(`<h2>تجديد الاستعارة</h2><form data-f="ren" data-id="${d.id}">${fld('مدة التجديد (أيام)','n','number',DB.set.ren,'min="1"')}${btns('تجديد','g')}</form>`),
ret:d=>{const l=DB.loan.find(x=>x.id===d.id);M(`<h2>استعادة ${e(ldv(l).name)}</h2><p>${e(bor(l.bor).n)} · التأمين المدفوع ${mny(l.dep)}</p><form data-f="ret" data-id="${l.id}" data-dep="${l.dep}"><label>حالة الجهاز عند الرجوع</label><select name="c">${CONDS.map(c=>`<option ${c==='مستعمل'?'selected':''}>${c}</option>`).join('')}</select><label>حالة التأمين</label><select name="o"><option value="full">استعادة التأمين كاملًا</option><option value="don">التبرع بالتأمين</option><option value="ded">خصم التأمين (تلف / عدم إرجاع في الموعد)</option><option value="part">استرداد جزء والتبرع بجزء</option></select><div class="row"><div class="sp">${fld('المسترد','rf','number',l.dep,'min="0"')}</div><div class="sp">${fld('التبرع','dn','number','0','min="0"')}</div></div>${fld('ملاحظات','w')}${btns('تأكيد الاستعادة','o')}</form>`)},
rqok:d=>M(`<h2>قبول الطلب</h2><form data-f="rqrep" data-id="${d.id}" data-s="مقبول">${fld('رسالة للمستفيد (اختياري)','rp','text','يمكنك الاستلام في الموعد المحدد')}${btns('تأكيد القبول','g')}</form>`),
rqno:d=>M(`<h2>رفض الطلب</h2><form data-f="rqrep" data-id="${d.id}" data-s="مرفوض">${fld('سبب الرفض','rp','text','','required')}${btns('تأكيد الرفض','r')}</form>`),
rqdel:d=>{if(confirm('حذف الطلب؟')){DB.req=DB.req.filter(r=>r.id!==d.id);save();render()}},
rqloan:d=>{const r=DB.req.find(x=>x.id===d.id),b=bor(r.bor);if(b.bl)return toast('المستعير في القائمة السوداء');r.st='مقبول';S.pre={bor:b.id,type:r.type,days:r.days};save();A.newloan()},
exp:()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(DB)],{type:'application/json'}));a.download='zarf-tare2-backup-'+T()+'.json';a.click()},
demo:()=>{demo();save();render();toast('تم تحميل البيانات التجريبية')},
deladm:d=>{if(confirm('حذف المشرف '+d.id+'؟')){DB.admins=DB.admins.filter(a=>a.n!==d.id||a.main);save();render()}},
clr:()=>{if(confirm('حذف كل الأجهزة والمستعيرين والاستعارات والطلبات؟')){DB.dev=[];DB.bor=[];DB.loan=[];DB.req=[];DB.seq={};save();render()}}};

/* ---------- الدخول ---------- */
function enter(b,msgT){BN=b.id;try{localStorage.setItem('ztb',BN)}catch(x){}S.v='home';render();scrollTo(0,0);toast('أهلاً '+b.n+' 👋')}
function viaSocial(prov,em,name){em=(em||'').toLowerCase();if(!em)return toast('لم يصلنا بريد إلكتروني من الحساب');let b=DB.bor.find(x=>x.em.toLowerCase()===em);
 if(!b){b=mkBor({n:name||em.split('@')[0],ph:'',em,prov});save();enter(b);S.v='prof';render();toast('أهلاً '+b.n+' — أكمل بياناتك');return}
 enter(b)}
const load=src=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.async=true;s.onload=ok;s.onerror=no;document.head.append(s)});
async function social(p){
 if(p==='google'){if(!CFG.GOOGLE)return M(`<h2>الدخول بجوجل</h2><p>هذه الميزة تحتاج ربط التطبيق بحساب Google (Client ID). حتى يتم ذلك، يمكنك إنشاء حساب بالبريد الإلكتروني وكلمة المرور.</p>${btns('حسنًا')}`);
  try{await load('https://accounts.google.com/gsi/client');google.accounts.id.initialize({client_id:CFG.GOOGLE,callback:r=>{try{const j=JSON.parse(decodeURIComponent(escape(atob(r.credential.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')))));viaSocial('google',j.email,j.name)}catch(x){toast('تعذر الدخول بجوجل')}}});google.accounts.id.prompt()}catch(x){toast('تعذر تحميل خدمة جوجل')}}
 else{if(!CFG.FB)return M(`<h2>الدخول بفيسبوك</h2><p>هذه الميزة تحتاج ربط التطبيق بحساب Facebook (App ID). حتى يتم ذلك، يمكنك إنشاء حساب بالبريد الإلكتروني وكلمة المرور.</p>${btns('حسنًا')}`);
  try{if(!window.FB){await load('https://connect.facebook.net/ar_AR/sdk.js');FB.init({appId:CFG.FB,version:'v19.0'})}FB.login(r=>{if(r.authResponse)FB.api('/me',{fields:'name,email'},u=>viaSocial('facebook',u.email,u.name));else toast('تم إلغاء الدخول')},{scope:'email,public_profile'})}catch(x){toast('تعذر تحميل خدمة فيسبوك')}}}

const F={
alogin:fd=>{const n=fd.get('n').trim().toLowerCase(),u=DB.admins.find(x=>x.n.toLowerCase()===n&&x.h===hs(fd.get('p')));if(!u)return toast('اسم المستخدم أو كلمة المرور غير صحيحة');AD=u.n;try{sessionStorage.setItem('zta',AD)}catch(x){}S.v='home';render();toast('أهلاً '+u.n)},
blogin:fd=>{const id=fd.get('u').trim().toLowerCase(),b=DB.bor.find(x=>x.pw&&x.pw===hs(fd.get('p'))&&((x.em&&x.em.toLowerCase()===id)||(x.ph&&phn(x.ph)===phn(id))));if(!b)return toast('بيانات الدخول غير صحيحة');enter(b)},
breg:fd=>{const em=fd.get('em').trim().toLowerCase(),ph=fd.get('ph').trim(),ex=DB.bor.find(x=>(x.em&&x.em.toLowerCase()===em)||(x.ph&&phn(x.ph)===phn(ph)));
 if(ex)return toast(ex.pw?'هذا الحساب مسجل بالفعل، سجّل الدخول':'بياناتك مسجلة لدينا، تواصل مع المؤسسة لتفعيل حسابك');
 const b=mkBor({n:fd.get('n').trim(),ph,em,pw:hs(fd.get('p')),prov:'email'});save();enter(b);S.v='prof';render();toast('تم إنشاء حسابك — أكمل بياناتك')},
user:fd=>{const n=fd.get('n').trim();if(DB.admins.some(u=>u.n.toLowerCase()===n.toLowerCase()))return toast('الاسم مستخدم');DB.admins.push({n,h:hs(fd.get('p'))});save();render();toast('تمت إضافة المشرف')},
cfg:fd=>{DB.set.days=+fd.get('days')||14;DB.set.ren=+fd.get('ren')||7;DB.set.terms=fd.get('terms').split('\n').map(x=>x.trim()).filter(Boolean);save();toast('تم حفظ الشروط')},
autosave:(fd,d,quiet=true)=>{const b=bor(d.id||BN);PROF.forEach(k=>{const v=fd.get(k);if(v!==null&&(k!=='n'||v.trim()))b[k]=String(v).trim()});save();const s=$('#sv');if(s)s.textContent='تم الحفظ ✓'},
prof:(fd,d)=>{F.autosave(fd,d);render();toast('تم حفظ بياناتك')},
dedit:async(fd,d)=>{const v=dev(d.id);v.name=fd.get('n').trim()||v.name;v.cond=fd.get('cond');v.dep=+fd.get('dep')||0;v.ic=ico(v.name,v.cat);const f=fd.get('img');if(f&&f.size)v.img=await rz(f,360,.7);save();X();render()},
dev:async fd=>{const f=fd.get('img'),img=f&&f.size?await rz(f,360,.7):'';mk(fd.get('c'),fd.get('n').trim(),Math.min(+fd.get('q')||1,50),fd.get('s'),img,fd.get('dep'));save();X();render();toast('تمت الإضافة والتكويد')},
cat:fd=>{DB.cats.push({id:uid(),n:fd.get('n'),ic:fd.get('i')||'📦',p:'C'+(DB.cats.length+1)});save();X();render()},
bor:async fd=>{const docs=[];for(const f of fd.getAll('docs').slice(0,4))if(f.size)docs.push(await rz(f,800,.55));const o={docs};PROF.forEach(k=>o[k]=String(fd.get(k)||'').trim());mkBor(o);save();X();render();toast('تم تسجيل المستعير')},
bedit:async(fd,d)=>{const b=bor(d.id);PROF.forEach(k=>{const v=fd.get(k);if(v!==null)b[k]=String(v).trim()});for(const f of fd.getAll('docs').slice(0,4))if(f.size)b.docs.push(await rz(f,800,.55));save();X();render();toast('تم الحفظ')},
bl:(fd,d)=>{bor(d.id).bl=fd.get('w');save();X();render();toast('تمت الإضافة للقائمة السوداء')},
loan:fd=>{const c=String(fd.get('b')).split(' · ')[0].trim(),b=DB.bor.find(x=>x.code===c||x.n===c);if(!b)return toast('المستعير غير مسجل، سجّله أولًا');if(b.bl)return toast('مرفوض: المستعير في القائمة السوداء');const d=dev(fd.get('d'));if(!d.id||st(d)!=='متاح')return toast('الجهاز غير متاح');const n=+fd.get('n')||DB.set.days;DB.loan.push({id:uid(),no:nextNo(),dev:d.id,bor:b.id,start:T(),days:n,due:add(T(),n),dep:+fd.get('p')||0,why:fd.get('w'),acc:fd.get('acc'),g:fd.get('g'),gp:fd.get('gp'),gn:fd.get('gn'),by:AD,ren:0,ret:null});save();X();S.v='loan';S.lt='act';render();toast('تم تسجيل الاستعارة')},
ren:(fd,d)=>{const l=DB.loan.find(x=>x.id===d.id),n=+fd.get('n')||7;l.due=add(l.due,n);l.days+=n;l.ren++;save();X();render();toast('تم التجديد '+n+' أيام إضافية')},
ret:(fd,d)=>{const l=DB.loan.find(x=>x.id===d.id),dep=+l.dep,o=fd.get('o');let rf=+fd.get('rf')||0,dn=+fd.get('dn')||0;if(o==='full'){rf=dep;dn=0}else if(o==='don'){rf=0;dn=dep}else if(o==='ded'){rf=0;dn=0}else{rf=Math.min(rf,dep);dn=Math.min(dn,dep-rf)}
 l.ret={d:T(),c:fd.get('c'),o,rf,dn,dd:dep-rf-dn,w:fd.get('w'),late:T()>l.due};if(dev(l.dev).id)dev(l.dev).cond=fd.get('c');save();X();S.lt='done';render();toast('تمت الاستعادة')},
breq:fd=>{const b=bor(BN);if(b.bl)return toast('لا يمكن تقديم الطلب');const days=Math.min(+fd.get('d')||DB.set.days,DB.set.days),r={id:uid(),bor:BN,type:fd.get('t'),when:fd.get('w'),why:fd.get('y'),days,st:'جديد',rp:'',at:T()};DB.req.push(r);save();S.pre=null;
 const m=`طلب استعارة جهاز — خدمة ظرف طارئ\nالاسم: ${b.n}\nالموبايل: ${b.ph}\nالرقم القومي: ${b.nid}\nالجهاز: ${r.type}\nموعد الاستلام: ${r.when||'-'}\nالمدة: ${days} يوم\nالسبب: ${r.why}`;
 M(`<h2>تم حفظ طلبك ✅</h2><p>سنراجع طلبك ونرد عليك، وتجد الرد في تبويب «طلباتي». يمكنك أيضًا إرساله لنا عبر واتساب لتسريع الرد.</p><div class="row" style="margin-top:12px"><a class="b w" href="${wa(CFG.WA,m)}">إرسال عبر واتساب</a><button class="g" data-a="go" data-id="my" onclick="X()">طلباتي</button></div>`);S.v='my';render()},
rqrep:(fd,d)=>{const r=DB.req.find(x=>x.id===d.id);r.st=d.s;r.rp=fd.get('rp');save();X();render()},
find:fd=>{S.fq={k:fd.get('k'),q:fd.get('q'),s:fd.get('s'),a:fd.get('a'),z:fd.get('z'),p1:fd.get('p1'),p2:fd.get('p2')};render()},
chat:fd=>{const q=fd.get('q');$('#cf').reset();chatSay(q)}};

document.addEventListener('click',ev=>{const t=ev.target.closest('[data-a]');if(t&&A[t.dataset.a])A[t.dataset.a](t.dataset)});
document.addEventListener('submit',ev=>{const f=ev.target.closest('form[data-f]');if(!f)return;ev.preventDefault();F[f.dataset.f](new FormData(f),f.dataset)});
document.addEventListener('input',ev=>{const t=ev.target;
 if(t.dataset.q!==undefined){S.q=t.value;const p=t.selectionStart;render();const n=$('[data-q]');n.focus();n.setSelectionRange(p,p)}
 const f=t.form;if(f&&f.dataset.auto!==undefined){clearTimeout(AS);AS=setTimeout(()=>F.autosave(new FormData(f),f.dataset),500)}});
document.addEventListener('change',async ev=>{const t=ev.target;
 if(t.name==='o'&&t.form){const dep=+t.form.dataset.dep,f=t.form,v=t.value;f.rf.value=v==='full'?dep:0;f.dn.value=v==='don'?dep:0}
 if(t.name==='d'&&t.form&&t.form.dataset.f==='loan'){t.form.p.value=dev(t.value).dep||0}
 if(t.id==='pdocs'){const b=bor(BN);for(const f of [...t.files].slice(0,4))if(f.size&&b.docs.length<8)b.docs.push(await rz(f,800,.55));save();render();toast('تم رفع الأوراق')}
 if(t.id==='imp'&&t.files[0]){const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.dev)throw 0;if(x.users&&!x.admins)x.admins=x.users;if(!x.admins)throw 0;if(confirm('استبدال كل البيانات الحالية بالنسخة المستوردة؟')){DB={admins:[],cats:[],dev:[],bor:[],loan:[],req:[],seq:{},...x};DB.set=DB.set||{days:14,ren:7,terms:DEF_TERMS};if(!DB.admins.some(a=>a.n==='angel'))DB.admins.push({n:'angel',h:hs('8585'),main:1});save();render();toast('تم الاستيراد')}}catch(z){toast('ملف غير صالح')}};r.readAsText(t.files[0])}});
addEventListener('beforeinstallprompt',ev=>{ev.preventDefault();DIP=ev});
addEventListener('appinstalled',()=>{DIP=null;toast('تم تثبيت التطبيق ✓')});
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
save();render();
